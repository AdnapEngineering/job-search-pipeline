name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4
      # setup-uv publishes no moving major tag, so pin the release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --locked fails when pyproject.toml changed without a matching `uv lock`
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check shell scripts
        run: bash -n run_job_search.sh
      - name: Test
        run: uv run python -m unittest discover -s tests
